<!doctype html>
<html lang="en">
  <head>
    <!-- ============================================================
         CONFIGURACIÓN BÁSICA DEL DOCUMENTO
         ============================================================ -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título del proyecto -->
    <title>InventarioTI.Frontend</title>

    <!-- Base para rutas relativas en Blazor -->
    <base href="/" />

    <!-- ============================================================
         CSS DE LA APLICACIÓN
         ============================================================ -->

    <!-- Estilos propios del proyecto (wwwroot/css/app.css) -->
    <link href="css/app.css" rel="stylesheet" />

    <!-- Estilos generados automáticamente por Blazor (scoped CSS) -->
    <link href="InventarioTI.Frontend.styles.css" rel="stylesheet" />

    <!-- ============================================================
         CSS DE MUDBLAZOR (ESTO ES LO QUE FALTABA)
         Sin esto, MudBlazor NO aplica estilos y todo se ve crudo.
         ============================================================ -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Contenedor principal donde Blazor renderiza la app -->
    <div id="app">Loading...</div>

    <!-- ============================================================
         SCRIPTS NECESARIOS PARA BLazor WebAssembly
         ============================================================ -->

    <!-- Script principal de Blazor WebAssembly -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Script de MudBlazor (para componentes interactivos) -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
  </body>
</html>
